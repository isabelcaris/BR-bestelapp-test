<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bar dashboard - Job Fair Drinks</title>
<link rel="stylesheet" href="style.css" />
<style>
.board {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
@media (max-width: 800px) {
  .board { grid-template-columns: 1fr; }
}
.column {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px;
  min-height: 200px;
}
.column h2 {
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 0.03em;
  color: var(--muted);
  margin: 0 0 10px;
  display: flex;
  justify-content: space-between;
}
.order-card {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
}
.order-card .stand-name { font-weight: 700; font-size: 15px; }
.order-card .time { color: var(--muted); font-size: 12px; }
.order-card ul { margin: 6px 0; padding-left: 18px; }
.order-card .note { font-style: italic; font-size: 13px; color: var(--warn); }
.order-card .actions { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.order-card .actions button { padding: 6px 10px; font-size: 13px; }
</style>
</head>
<body>
<header class="top">
  <h1>🍹 Bar dashboard</h1>
  <nav>
    <a href="admin.html">Admin</a>
    <a href="bar.html" class="active">Bar dashboard</a>
    <a href="print.html">Print QR codes</a>
  </nav>
</header>

<div class="page">
  <div class="row" style="justify-content: space-between; align-items:center; margin-bottom: 10px;">
    <label class="row" style="align-items:center; gap:6px;">
      <input type="checkbox" id="sound-toggle" checked style="width:auto;" />
      <span class="small muted">Play sound on new order</span>
    </label>
    <span class="small muted" id="last-updated"></span>
  </div>

  <div class="board">
    <div class="column">
      <h2><span>Pending</span><span id="count-pending">0</span></h2>
      <div id="col-pending"></div>
    </div>
    <div class="column">
      <h2><span>Preparing</span><span id="count-preparing">0</span></h2>
      <div id="col-preparing"></div>
    </div>
    <div class="column">
      <h2><span>Delivered (last hour)</span><span id="count-delivered">0</span></h2>
      <div id="col-delivered"></div>
    </div>
  </div>
</div>

<script src="bar.js"></script>
</body>
</html>

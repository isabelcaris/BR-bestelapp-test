<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin - Job Fair Drinks</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <h1>🍹 Job Fair Drinks - Admin</h1>
  <nav>
    <a href="admin.html" class="active">Admin</a>
    <a href="bar.html">Bar dashboard</a>
    <a href="print.html">Print QR codes</a>
  </nav>
</header>

<div class="page">

  <div class="card" id="network-card">
    <h2>Network</h2>
    <p class="muted small">Partners scan QR codes to place orders, so this page must be open using an address their phones can reach over the venue wifi - not <code>localhost</code>.</p>
    <div id="network-info" class="muted small">Checking...</div>
  </div>

  <div class="card">
    <h2>Drink menu</h2>
    <div class="row" style="margin-bottom:12px;">
      <input type="text" id="drink-name" placeholder="Drink name (e.g. Espresso)" style="flex:2;" />
      <input type="number" id="drink-price" placeholder="Price (optional)" step="0.01" min="0" style="flex:1;" />
      <button id="add-drink-btn">Add drink</button>
    </div>
    <div id="drinks-list"></div>
  </div>

  <div class="card">
    <h2>Stands</h2>
    <div class="row" style="margin-bottom:12px;">
      <input type="text" id="stand-name" placeholder="Stand name (e.g. Acme Corp - Stand 12)" style="flex:2;" />
      <button id="add-stand-btn">Add stand</button>
    </div>
    <div id="stands-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>

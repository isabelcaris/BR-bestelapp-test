<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Beheer - Ekonomika Jobbeurs</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header class="top">
  <h1>Ekonomika Jobbeurs - Beheer</h1>
  <nav>
    <a href="admin.html" class="active">Beheer</a>
    <a href="bar.html">Bardashboard</a>
    <a href="print.html">QR-codes printen</a>
  </nav>
</header>

<div class="page">

  <div class="card" id="network-card">
    <h2>Netwerk</h2>
    <p class="muted small">Partners scannen QR-codes om te bestellen, dus deze pagina moet open staan op een adres dat hun telefoon kan bereiken via de wifi van de locatie - niet <code>localhost</code>.</p>
    <div id="network-info" class="muted small">Bezig met controleren...</div>
  </div>

  <div class="card">
    <h2>Drankenkaart</h2>
    <div class="row" style="margin-bottom:12px;">
      <input type="text" id="drink-name" placeholder="Naam drankje (bv. Espresso)" style="flex:2;" />
      <input type="number" id="drink-price" placeholder="Prijs (optioneel)" step="0.01" min="0" style="flex:1;" />
      <button id="add-drink-btn">Drankje toevoegen</button>
    </div>
    <div id="drinks-list"></div>
  </div>

  <div class="card">
    <h2>Stands</h2>
    <div class="row" style="margin-bottom:12px;">
      <input type="text" id="stand-name" placeholder="Naam stand (bv. Acme Corp - Stand 12)" style="flex:2;" />
      <button id="add-stand-btn">Stand toevoegen</button>
    </div>
    <div id="stands-list"></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
